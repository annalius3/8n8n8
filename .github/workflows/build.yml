name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoposting_flow?schema=public

      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoposting_flow?schema=public
          AUTH_SECRET: test-test-test-test-test-test-test-test
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SCHEDULER_TOKEN: test-test-test-test
